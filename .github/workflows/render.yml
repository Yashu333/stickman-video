name: Render video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # System libraries Remotion's headless Chrome needs on Ubuntu.
      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2 libcairo2 \
            libpango-1.0-0 libatk-bridge2.0-0

      - run: npm ci

      - name: Render StickmanVideo
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: stickman-video
          path: out/video.mp4
          if-no-files-found: error
